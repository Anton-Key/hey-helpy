# Выкладка Edge Functions (supabase/functions/) в рабочий проект Supabase.
# Только вручную и только с ветки main: Actions → "Deploy functions" → Run workflow →
# Review deployments → production-db → Approve. Подробно — CLAUDE.md, «Edge Functions».
#
# Токен — секрет SUPABASE_ACCESS_TOKEN окружения production-db (в лог не печатается).
# Секреты самой функции (YANDEX_API_KEY, YANDEX_FOLDER_ID) задаются в Supabase
# (Edge Functions → Secrets) и этим workflow не трогаются.
#
# Claude Code этот workflow НЕ запускает.
name: Deploy functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: oguiwftspuzmffynkykl
  FUNCTION: voice-intake

jobs:
  # Без секретов: не с main — остановка ещё до запроса одобрения.
  guard:
    name: Проверка ветки
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Только main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Deploy functions запускается только с ветки main (сейчас: $GITHUB_REF)."
            exit 1
          fi
          echo "Ветка main — можно одобрять."

  deploy:
    name: Выкладка функции (после одобрения)
    needs: guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-db
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Проверить секрет
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN//[[:space:]]/}" ]; then
            echo "::error::В окружении production-db не задан секрет SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          echo "Секрет на месте."

      # Версия CLI зафиксирована: обновлять осознанно.
      - uses: supabase/setup-cli@v2.1.2
        with:
          version: 2.117.0

      - name: Выложить функцию
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          supabase --version
          # --use-api: сборка на стороне Supabase, без Docker.
          # verify_jwt = true берётся из supabase/config.toml.
          supabase functions deploy "$FUNCTION" --project-ref "$PROJECT_REF" --use-api

      # Без токена пользователя функция должна ответить 401: значит, она
      # развёрнута и закрыта для анонимов. Новая версия поднимается не сразу —
      # до 6 попыток.
      - name: Проверка (запрос без токена → 401)
        id: verify
        run: |
          url="https://$PROJECT_REF.supabase.co/functions/v1/$FUNCTION"
          code=000
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
              -X POST "$url" -H 'Content-Type: application/json' -d '{"text":"test","locale":"ru"}' || true)
            echo "Попытка $i: HTTP $code"
            [ "$code" = "401" ] && break
            sleep 5
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" != "401" ]; then
            echo "::error::Ожидался ответ 401 без токена, получен $code."
            exit 1
          fi

      - name: Сводка
        if: always()
        run: |
          {
            echo "## Deploy functions"
            echo
            case "${{ steps.deploy.outcome }}" in
              success) echo "✅ Функция \`$FUNCTION\` выложена в проект \`$PROJECT_REF\`." ;;
              failure) echo "❌ Выкладка не удалась — текст ошибки в логе шага «Выложить функцию». Работает прежняя версия (если была)." ;;
              *)       echo "⚠️ Выкладка не выполнялась: остановлено раньше (см. шаг «Проверить секрет»)." ;;
            esac
            echo
            case "${{ steps.verify.outcome }}" in
              success) echo "✅ Проверка: без токена пользователя — HTTP 401 (функция закрыта для анонимов)." ;;
              failure) echo "❌ Проверка: ожидался HTTP 401, получен ${{ steps.verify.outputs.code }}." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
