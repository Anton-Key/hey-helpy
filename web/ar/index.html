<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AR-метки — демо</title>
  <meta name="description" content="Эй, Helpy — демо WebXR: метка над оборудованием с заявками и плановым ТО.">
  <link rel="icon" type="image/png" href="../favicon.png">
  <!--
    Шаг 25 — WebXR-демо «AR-метки» (отдельная страница, вне Flutter).
    Работает в Chrome на Android с ARCore: immersive-ar + hit-test
    (+ dom-overlay и anchors, если есть). Вход — сессия приложения из
    localStorage того же сайта; адрес базы и anon-ключ пишет приложение
    (`hh.web.supabase`, lib/core/web_bridge.dart). Данные — под RLS
    пользователя. Метки живут, пока открыта страница.
  -->
  <style>
    @font-face { font-family: Onest; src: url(../assets/assets/fonts/Onest-Regular.ttf); font-weight: 400; }
    @font-face { font-family: Onest; src: url(../assets/assets/fonts/Onest-SemiBold.ttf); font-weight: 600; }
    :root {
      --bg: #F2F4F3; --surface: #FFFFFF; --ink: #0F1A17; --secondary: #5B6763; --fill: #E4E8E6;
      --accent: #2DB89A; --on-accent: #062B23; --accent-text: #0B7A62; --accent-tint: #E2F4EF;
      --danger: #B42318; --overlay: rgba(0, 0, 0, .55); --glass: rgba(255, 255, 255, .95);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0F1513; --surface: #1A2320; --ink: #EEF2F0; --secondary: #A3ADA9; --fill: #26302C;
        --accent-text: #5FD3B6; --accent-tint: #183A31; --glass: rgba(26, 35, 32, .95);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--ink); font: 400 16px/1.4 Onest, system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: 28px; line-height: 1.15; margin: 8px 0 4px; font-weight: 600; }
    .eyebrow { color: var(--accent-text); font-size: 13px; font-weight: 600; }
    p { margin: 8px 0; }
    .muted { color: var(--secondary); font-size: 14px; }
    .card { background: var(--surface); border-radius: 16px; padding: 16px; margin: 16px 0; }
    .btn { display: block; width: 100%; border: 0; border-radius: 999px; padding: 15px 18px; font: 600 17px Onest, sans-serif;
           text-align: center; text-decoration: none; cursor: pointer; margin-top: 10px; }
    .btn.primary { background: var(--accent); color: var(--on-accent); }
    .btn.secondary { background: var(--fill); color: var(--ink); }
    .btn:disabled { opacity: .5; }
    .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--fill); }
    .row:first-child { border-top: 0; }
    .row .t { flex: 1; min-width: 0; }
    .row .s { color: var(--secondary); font-size: 13px; }
    .pill { background: var(--accent-tint); color: var(--accent-text); border-radius: 999px; padding: 2px 9px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .err { color: var(--danger); }
    [hidden] { display: none !important; }
    /* Поверх AR (dom-overlay) */
    #overlay { position: fixed; inset: 0; pointer-events: none; font-family: Onest, sans-serif; }
    #overlay .top, #overlay .bottom { position: absolute; left: 12px; right: 12px; pointer-events: auto; }
    #overlay .top { top: 12px; display: flex; gap: 8px; align-items: center; }
    #overlay .bottom { bottom: 16px; }
    .bubble { background: var(--overlay); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14px; }
    .close { background: #fff; color: #0F1A17; border: 0; border-radius: 999px; width: 40px; height: 40px; font-size: 20px; }
    .sheet { background: var(--glass); color: var(--ink); border-radius: 16px; padding: 12px 14px; max-height: 50vh; overflow: auto; }
    .sheet button.asset { display: block; width: 100%; text-align: start; background: none; border: 0; border-top: 1px solid var(--fill);
                          padding: 11px 2px; font: 400 16px Onest, sans-serif; color: var(--ink); }
    .sheet button.asset:first-of-type { border-top: 0; }
  </style>
</head>
<body>
  <main id="start">
    <div class="eyebrow" data-t="brand"></div>
    <h1 data-t="title"></h1>
    <p class="muted" data-t="intro"></p>

    <section id="state-loading" class="card"><p data-t="loading"></p></section>

    <section id="state-login" class="card" hidden>
      <p data-t="needLogin"></p>
      <a class="btn primary" href="../" data-t="openApp"></a>
    </section>

    <section id="state-unsupported" class="card" hidden>
      <p data-t="unsupported"></p>
      <p class="muted" data-t="unsupportedHint"></p>
      <a class="btn primary" id="to-camera" data-t="openCamera"></a>
    </section>

    <section id="state-ready" hidden>
      <div class="card">
        <div class="muted" id="place"></div>
        <div id="assets"></div>
      </div>
      <button class="btn primary" id="start-ar" data-t="startAr"></button>
      <p class="muted" data-t="howTo"></p>
      <p class="muted" data-t="ephemeral"></p>
      <a class="btn secondary" id="to-camera2" data-t="openCamera"></a>
    </section>

    <p id="error" class="err" hidden></p>
  </main>

  <div id="overlay" hidden>
    <div class="top">
      <button class="close" id="end-ar" aria-label="close">×</button>
      <div class="bubble" id="hint"></div>
    </div>
    <div class="bottom">
      <div class="sheet" id="picker" hidden>
        <div class="muted" data-t="pickAsset"></div>
        <div id="picker-list"></div>
      </div>
    </div>
  </div>

  <script type="module" src="ar.js"></script>
</body>
</html>
