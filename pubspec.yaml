name: hey_helpy
description: "Hey Helpy — AI-помощник для эксплуатации объектов недвижимости (mobile + web)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.6
  go_router: ^14.2.0
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  geolocator: ^14.1.1
  package_info_plus: ^10.2.2
  speech_to_text: ^7.5.0
  web: ^1.1.1
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  lucide_icons_flutter: 3.1.20
  excel: ^4.0.6
  file_picker: ^13.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  fonts:
    # Onest (SIL OFL 1.1, assets/fonts/OFL.txt) — локально, не из сети.
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Regular.ttf
          weight: 400
        - asset: assets/fonts/Onest-Medium.ttf
          weight: 500
        - asset: assets/fonts/Onest-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Onest-Bold.ttf
          weight: 700
