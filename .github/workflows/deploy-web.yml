# Веб-версия Hey Helpy на GitHub Pages: https://anton-key.github.io/hey-helpy/
# Сборка — при каждом пуше в main (и вручную: Actions → "Deploy web" → Run workflow).
# Публикация — только если в репозитории включена переменная WEB_PUBLISH_ENABLED = true
# (Settings → Secrets and variables → Actions → Variables). Пока не применены исправления
# безопасности (миграция 0008), переменная должна быть выключена. Подробно — CLAUDE.md, «Веб-ссылка».
name: Deploy web

# Сайт продукта (папка site/, шаг 29) публикуется этой же выкладкой в подпапку /hey-helpy/site/:
# GitHub Pages заменяет сайт целиком при каждой выкладке, поэтому приложение и сайт собираются вместе
# (отдельная выкладка одного стёрла бы другое). «Deploy site» (deploy-site.yml) вызывает этот же файл.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # В веб-сборку попадает только публичный (anon) ключ: он виден любому, кто откроет сайт.
      # Ключ service_role / secret открыл бы всю базу в обход RLS — такой ключ останавливает сборку.
      - name: Check Supabase key is public (anon)
        env:
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$KEY" ] || [ -z "$URL" ]; then
            echo "::error::Нет секретов SUPABASE_URL / SUPABASE_ANON_KEY"; exit 1
          fi
          case "$KEY" in
            sb_secret_*) echo "::error::В SUPABASE_ANON_KEY лежит секретный ключ, нужен publishable/anon"; exit 1 ;;
            sb_publishable_*) exit 0 ;;
          esac
          payload=$(echo "$KEY" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          role=$(echo "$payload" | base64 -d 2>/dev/null | jq -r '.role // empty')
          if [ "$role" != "anon" ]; then
            echo "::error::SUPABASE_ANON_KEY не является anon-ключом (role=$role)"; exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build web
        run: >
          flutter build web --release
          --base-href /hey-helpy/
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=MAP_TILE_KEY=${{ secrets.MAP_TILE_KEY }}

      # Если адрес внутри приложения открыть напрямую — Pages отдаст приложение, а не ошибку.
      - run: cp build/web/index.html build/web/404.html

      # Сайт продукта: статический HTML из site/ + картинки, значки и демо-видео → build/web/site/.
      # Несуществующий адрес внутри /site/ → страница 404 сайта (а не приложение).
      - name: Build product site
        run: |
          node tools/site/build.mjs --out build/web/site
          node -e "const f='build/web/404.html',fs=require('fs');fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('<head>','<head><script>if(location.pathname.indexOf(\'/hey-helpy/site/\')===0)location.replace(\'/hey-helpy/site/404.html\')</script>'))"
          grep -q "/hey-helpy/site/404.html" build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: vars.WEB_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
